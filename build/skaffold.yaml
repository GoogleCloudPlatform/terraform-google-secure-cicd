# [START gke_bank_of_anthos_skaffold_config_setup]
apiVersion: skaffold/v3
kind: Config
metadata:
  name: setup # module defining setup steps
manifests:
  rawYaml:
  - extras/jwt/jwt-secret.yaml
  - dev-kubernetes-manifests/config.yaml
deploy:
  kubectl: {}
# [END gke_bank_of_anthos_skaffold_config_setup]
---
# [START gke_bank_of_anthos_skaffold_config_db]
apiVersion: skaffold/v3
kind: Config
metadata:
  name: db # module defining database deployments
requires:
- configs:
  - setup
build:
  artifacts:
  - image: accounts-db
    context: src/accounts-db
  - image: ledger-db
    context: src/ledger-db
manifests:
  rawYaml:
  - dev-kubernetes-manifests/accounts-db.yaml
  - dev-kubernetes-manifests/ledger-db.yaml
deploy:
  kubectl: {}
# [END gke_bank_of_anthos_skaffold_config_db]
---
# [START gke_bank_of_anthos_skaffold_config_backend]
apiVersion: skaffold/v3
kind: Config
metadata:
  name: backend # module defining backend services
requires:
- configs:
  - db
build:
  artifacts:
  - image: ledgerwriter
    jib:
      project: src/ledgerwriter
  - image: balancereader
    jib:
      project: src/balancereader
  - image: transactionhistory
    jib:
      project: src/transactionhistory
  - image: contacts
    context: src/contacts
  - image: userservice
    context: src/userservice
manifests:
  rawYaml:
  - dev-kubernetes-manifests/balance-reader.yaml
  - dev-kubernetes-manifests/contacts.yaml
  - dev-kubernetes-manifests/ledger-writer.yaml
  - dev-kubernetes-manifests/transaction-history.yaml
  - dev-kubernetes-manifests/userservice.yaml
deploy:
  kubectl: {}
# [END gke_bank_of_anthos_skaffold_config_backend]
---
# [START gke_bank_of_anthos_skaffold_config_frontend]
apiVersion: skaffold/v3
kind: Config
metadata:
  name: frontend # module defining frontend service
build:
  artifacts:
  - image: frontend
    context: src/frontend
manifests:
  rawYaml:
  - dev-kubernetes-manifests/frontend.yaml
deploy:
  kubectl: {}

# Deployment verification (Health check executed by Cloud Deploy during rollout phases)
verify:
  - name: deployment-healthcheck
    container:
      name: healthcheck-runner
      image: google/cloud-sdk:slim
      env:
        - name: SERVICE_NAME
          value: "frontend"
        - name: HEALTHCHECK_PATH
          value: "/"
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          set -e
          echo "Starting health check verification for service: ${SERVICE_NAME}..."

          # Discover service load balancer endpoint IP via Google Cloud API
          IP=$(gcloud compute forwarding-rules list --filter="name ~ ${SERVICE_NAME}" --format="value(IP_ADDRESS)" | head -n 1)
          if [ -z "$IP" ]; then
            IP=$(gcloud compute forwarding-rules list --format="value(IP_ADDRESS)" | head -n 1)
          fi

          if [ -z "$IP" ]; then
            echo "ERROR: No active network endpoint found for service ${SERVICE_NAME}."
            exit 1
          fi

          ENDPOINT="http://${IP}${HEALTHCHECK_PATH}"
          echo "Querying health check at: ${ENDPOINT}"

          # Execute HTTP health check with retries for load balancer warm-up
          curl -f --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 "${ENDPOINT}" > /dev/null
          echo "Health check completed successfully: endpoint responded with HTTP 200 OK!"
# [END gke_bank_of_anthos_skaffold_config_frontend]
---
# [START gke_bank_of_anthos_skaffold_config_loadgenerator]
apiVersion: skaffold/v3
kind: Config
metadata:
  name: loadgenerator # module defining a load generator service
build:
  artifacts:
  - image: loadgenerator
    context: src/loadgenerator
manifests:
  rawYaml:
  - dev-kubernetes-manifests/loadgenerator.yaml
deploy:
  kubectl: {}
# [END gke_bank_of_anthos_skaffold_config_loadgenerator]
