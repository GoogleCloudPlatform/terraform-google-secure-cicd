apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: terraform-google-secure-cicd
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Secure CD Module
    source:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-secure-cicd.git
      sourceType: git
      dir: /modules/secure-cd
    version: 1.2.2
    actuationTool:
      flavor: Terraform
      version: ~> 1.3
    description: {}
  content:
    examples:
      - name: standalone_single_project
        location: examples/standalone_single_project
  interfaces:
    variables:
      - name: project_id
        description: Project ID for CICD Pipeline Project
        varType: string
        required: true
      - name: primary_location
        description: Primary Google Cloud region for deploying resources like Cloud Build triggers and Cloud Deploy pipelines.
        varType: string
        required: true
      - name: csr_cloudbuild_cd_repo
        description: Name of the CSR repo that stores the Cloud Build CD phase configs - for post-deployment checks
        varType: string
      - name: gar_repo_name
        description: Docker artifact registry repo to store app build images
        varType: string
        required: true
      - name: app_deploy_trigger_yaml
        description: Name of application cloudbuild yaml file for deployment
        varType: string
        required: true
      - name: deploy_branch_clusters
        description: A list of environment deployments, ordered by 'env_number'. target_type can be one of `gke`, `anthos_cluster`, or `run`. See [clouddeploy_target Terraform docs](https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/clouddeploy_target) for more details
        varType: |-
          map(object({
              name                  = string
              cluster               = string
              anthos_membership     = string
              project_id            = string
              location              = string
              required_attestations = list(string)
              env_attestation       = string
              env_number            = number
              target_type           = string
            }))
        defaultValue: {}
      - name: cache_bucket_name
        description: cloud build artifact bucket name
        varType: string
        required: true
      - name: additional_substitutions
        description: Parameters to be substituted in the build specification. All keys should begin with an underscore.
        varType: map(string)
        defaultValue: {}
      - name: cloudbuild_private_pool
        description: Cloud Build private pool self-link
        varType: string
        defaultValue: ""
      - name: clouddeploy_pipeline_name
        description: Cloud Deploy pipeline name
        varType: string
        required: true
      - name: cloudbuild_service_account
        description: Cloud Build SA email address
        varType: string
        required: true
      - name: access_level_name
        description: (VPC-SC) Access Level full name. When providing this variable, additional identities will be added to the access level, these are required to work within an enforced VPC-SC Perimeter.
        varType: string
      - name: repository_type
        description: The type of the repository. Must be one of 'GITHUB', 'GITLAB', or 'CSR'.
        varType: string
        required: true
      - name: cd_repository
        description: The CD repository to configure. The key is a short name for the service.
        varType: |-
          object({
              repository_name = string
              repository_url  = string
            })
      - name: github_auth
        description: Authentication configuration for GitHub. Required only if repo_type is 'GITHUBv2'.
        varType: |-
          object({
              secret_id         = string
              app_id_secret_id  = string
              secret_project_id = string
            })
      - name: gitlab_auth
        description: Authentication configuration for GitLab. Required only if repo_type is 'GITLABv2'.
        varType: |-
          object({
              read_authorizer_credential_secret_id = string
              authorizer_credential_secret_id      = string
              webhook_secret_id                    = string
              enterprise_host_uri                  = optional(string)
              enterprise_service_directory         = optional(string)
              enterprise_ca_certificate            = optional(string)
              secret_project_id                    = string
            })
    outputs:
      - name: binauthz_policy_required_attestations
        description: Binary Authorization policy required attestation in GKE projects
      - name: cd_repo_name
        description: Name of the CD source repository
      - name: clouddeploy_delivery_pipeline_id
        description: ID of the Cloud Deploy delivery pipeline
      - name: clouddeploy_target_id
        description: ID(s) of Cloud Deploy targets
      - name: clouddeploy_target_names_ordered
        description: Names of Cloud Deploy targets in promotion order
      - name: deploy_trigger_names
        description: Names of CD Cloud Build triggers
  requirements:
    roles:
      - level: Project
        roles:
          - roles/compute.networkAdmin
          - roles/container.admin
          - roles/binaryauthorization.policyEditor
          - roles/resourcemanager.projectIamAdmin
          - roles/iam.serviceAccountAdmin
          - roles/serviceusage.serviceUsageViewer
          - roles/iam.serviceAccountUser
      - level: Project
        roles:
          - roles/artifactregistry.admin
          - roles/binaryauthorization.attestorsAdmin
          - roles/cloudbuild.builds.builder
          - roles/cloudbuild.workerPoolOwner
          - roles/cloudbuild.admin
          - roles/clouddeploy.admin
          - roles/cloudkms.admin
          - roles/cloudkms.publicKeyViewer
          - roles/containeranalysis.notes.editor
          - roles/compute.admin
          - roles/compute.networkAdmin
          - roles/compute.securityAdmin
          - roles/gkehub.editor
          - roles/iam.serviceAccountAdmin
          - roles/iam.serviceAccountUser
          - roles/pubsub.editor
          - roles/serviceusage.serviceUsageAdmin
          - roles/source.admin
          - roles/storage.admin
          - roles/resourcemanager.projectIamAdmin
          - roles/viewer
          - roles/secretmanager.admin
          - roles/servicedirectory.admin
          - roles/dns.admin
    services:
      - accesscontextmanager.googleapis.com
      - aiplatform.googleapis.com
      - anthos.googleapis.com
      - anthosconfigmanagement.googleapis.com
      - anthospolicycontroller.googleapis.com
      - apikeys.googleapis.com
      - artifactregistry.googleapis.com
      - binaryauthorization.googleapis.com
      - certificatemanager.googleapis.com
      - cloudbilling.googleapis.com
      - cloudbuild.googleapis.com
      - clouddeploy.googleapis.com
      - cloudfunctions.googleapis.com
      - cloudkms.googleapis.com
      - cloudresourcemanager.googleapis.com
      - cloudtrace.googleapis.com
      - compute.googleapis.com
      - container.googleapis.com
      - containeranalysis.googleapis.com
      - containerscanning.googleapis.com
      - gkehub.googleapis.com
      - iam.googleapis.com
      - iap.googleapis.com
      - mesh.googleapis.com
      - modelarmor.googleapis.com
      - monitoring.googleapis.com
      - multiclusteringress.googleapis.com
      - multiclusterservicediscovery.googleapis.com
      - networkmanagement.googleapis.com
      - networkservices.googleapis.com
      - notebooks.googleapis.com
      - orgpolicy.googleapis.com
      - secretmanager.googleapis.com
      - servicedirectory.googleapis.com
      - servicemanagement.googleapis.com
      - servicenetworking.googleapis.com
      - serviceusage.googleapis.com
      - sourcerepo.googleapis.com
      - sqladmin.googleapis.com
      - storage.googleapis.com
      - trafficdirector.googleapis.com
    providerVersions:
      - source: hashicorp/google
        version: "> 4, < 8"
      - source: hashicorp/google-beta
        version: "> 4, < 8"
